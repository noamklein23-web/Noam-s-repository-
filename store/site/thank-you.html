<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>תודה על ההזמנה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&family=Suez+One&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root { --bg: #fbf7f1; --ink: #2b2420; --muted: #7a6e66; --line: #eadfce; --accent: #b0802b; --accent-dark: #8a6220; --accent-soft: #f6ecd9; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: 'Heebo', system-ui, sans-serif; font-size: 17px; line-height: 1.6; padding: 24px 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 32px 22px; max-width: 480px; width: 100%; text-align: center; }
  .brand { font-family: 'Suez One', serif; color: var(--accent-dark); font-size: 24px; }
  .icon { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-dark); display: grid; place-items: center; font-size: 32px; margin: 18px auto 10px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 12px; }
  .order { font-size: 20px; color: var(--ink); font-weight: 800; }
  a.btn { display: inline-block; margin-top: 14px; background: var(--accent); color: #fff; text-decoration: none; padding: 12px 26px; border-radius: 999px; font-weight: 800; }
  .spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .9s linear infinite; margin: 18px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main class="card">
  <div class="brand" id="brand">שלנו</div>
  <div class="spinner" id="spinner"></div>
  <div id="content" hidden>
    <div class="icon">🤍</div>
    <h1>תודה! ההזמנה התקבלה</h1>
    <p class="order" id="orderLine"></p>
    <p>השרשרת שלכם נכנסת עכשיו לייצור. זמן הכנה ומשלוח: <b id="delivery"></b>.</p>
    <p>שלחנו לכם מייל עם פרטי ההזמנה, ומספר מעקב יישלח ברגע שהיא יוצאת לדרך.</p>
    <p id="fallback" hidden>לא קיבלתם מייל תוך שעה? כתבו לנו <a id="wa" href="#">בוואטסאפ</a> ונבדוק.</p>
    <a class="btn" href="index.html">חזרה לאתר</a>
  </div>
</main>
<script>
(async function () {
  const S = window.STORE || {};
  document.getElementById('brand').textContent = S.name || 'שלנו';
  document.getElementById('delivery').textContent = S.deliveryText || '';
  const wa = document.getElementById('wa');
  wa.href = 'https://wa.me/' + (S.whatsapp || '') + '?text=' + encodeURIComponent('היי, שילמתי על הזמנה ולא קיבלתי מייל אישור');
  wa.target = '_blank';

  let pending = null;
  try { pending = JSON.parse(localStorage.getItem('pendingOrder') || 'null'); } catch (_) {}

  const show = (orderId, ok) => {
    document.getElementById('spinner').hidden = true;
    document.getElementById('content').hidden = false;
    if (orderId) document.getElementById('orderLine').textContent = 'מספר הזמנה #' + orderId;
    if (!ok) document.getElementById('fallback').hidden = false;
  };

  if (!pending || !S.appsScriptUrl) { show(null, false); return; }

  try {
    const res = await fetch(S.appsScriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'paid', orderId: pending.orderId, token: pending.token }),
    });
    const data = await res.json();
    if (data.ok) { try { localStorage.removeItem('pendingOrder'); } catch (_) {} }
    show(pending.orderId, !!data.ok);
  } catch (_) {
    show(pending.orderId, false);
  }
})();
</script>
</body>
</html>
